[project]
name = "plain-memory"
version = "0.1.0"
description = "A small synchronous Add/Search memory service for AML."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "numpy>=2,<3",
  "pydantic>=2.10,<3",
  "PyYAML>=6,<7",
  "rank-bm25>=0.2.2,<0.3",
  "tiktoken>=0.9,<1",
  "uvicorn>=0.34,<1",
]

[project.scripts]
plain-memory = "plain_memory.__main__:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
